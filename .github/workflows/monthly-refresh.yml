# Monthly data refresh
#
# After each month ends, download that month from the PHIVOLCS monthly archive,
# check it, save it to default_data.csv, and redeploy the app to shinyapps.io.
#
# PHIVOLCS publishes a month's archive page a few days after the month ends, so
# this runs on the 2nd, 4th, 6th, 8th and 10th. Once the data is updated, the
# later runs find nothing new and stop without changing anything. If the
# archive is still missing on the 10th, or the page doesn't pass the checks
# (for example because PHIVOLCS changed its format), the run fails, nothing is
# changed, and GitHub e-mails you.
#
# You can also start it by hand: GitHub > Actions > Monthly data refresh >
# Run workflow.
#
# One-time setup: see "Automatic monthly updates" in README.md.

name: Monthly data refresh

on:
  schedule:
    # 01:00 UTC = 09:00 Philippine time
    - cron: "0 1 2,4,6,8,10 * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Redeploy the app even if the data did not change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Manila

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system libraries (for sf and rvest)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev \
            libudunits2-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Install R packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Download and check last month's data
        id: refresh
        run: Rscript scripts/refresh_data.R

      - name: Check that the app works with the new data
        if: steps.refresh.outputs.changed == 'true' || inputs.deploy
        run: Rscript scripts/check_app.R

      - name: Save the new data to the repository
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add default_data.csv
          git commit -m "Data: monthly PHIVOLCS refresh ($(date +%Y-%m-%d))"
          git push

      - name: Deploy to shinyapps.io
        if: steps.refresh.outputs.changed == 'true' || inputs.deploy
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APP_NAME: ${{ vars.SHINYAPPS_APP_NAME }}
        run: |
          if [ -z "$SHINYAPPS_TOKEN" ]; then
            echo "::warning::shinyapps.io secrets are not set, so the app was not redeployed. See README.md."
            exit 0
          fi
          Rscript -e 'install.packages("rsconnect")'
          Rscript scripts/deploy.R
